name: Deploy Ninja Analytics

# Live-deploys and live-verifies the Supabase side of this project: applies
# pending migrations, deploys every Edge Function, then proves the result by
# actually calling the health-check/full-sync functions and checking that
# GSC/GA4/Bing/uptime rows land - not just that the code compiles or the
# functions upload.
#
# Auth: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF only (GitHub Actions
# repository secrets). No SUPABASE_DB_PASSWORD is set or requested - `supabase
# db push` is attempted for real, but this project's live database has no
# recorded migration history in supabase_migrations.schema_migrations (every
# migration to date was actually applied through the Management API path
# below, never through a successful `db push`), so the CLI always concludes
# nothing has been applied yet and tries to replay migration 0001 from
# scratch, which fails with "relation already exists" (SQLSTATE 42P07). That
# failure is expected, not a real regression - the fallback below is the
# real, working mechanism.
#
# The fallback re-applies EVERY migration file from 0011 onward (0011 was
# the first migration written idempotently), via the Management API's
# database/query endpoint (scripts/mgmt_sql.sh), authenticating with the
# access token alone. It is NOT hardcoded to a single migration file: it
# globs supabase/migrations/*.sql and runs every one whose numeric prefix is
# 0011 or later, in order, every deploy. This only stays safe as long as
# every migration from 0011 onward is written to tolerate being executed
# more than once - `create table if not exists`, `create index if not
# exists`, `drop policy if exists ... ; create policy ...`, `create or
# replace function`, and naturally-idempotent grant/revoke. Follow that
# convention for every future migration or this fallback will start failing
# on its second run the same way `db push` already does.
#
# Migrations 0001-0010 are intentionally excluded (they predate the
# idempotent convention and are already confirmed live) - never add them
# here without first making them idempotent too.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-ninja-analytics.yml"

concurrency:
  group: deploy-ninja-analytics-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Link, migrate, deploy, verify live
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity-check required secrets are present
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is not set}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret is not set}"
          echo "Project ref: ${SUPABASE_PROJECT_REF}"

      - name: Link to the live project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Diagnostic - identity used by the Management API query endpoint
        run: |
          bash .github/workflows/scripts/mgmt_sql.sh \
            "select session_user, current_user, current_setting('is_superuser') as is_superuser;" \
            | tee /tmp/identity.json
          {
            echo "### Management API connection identity"
            echo '```json'
            cat /tmp/identity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migration dry-run (informational only, no side effects)
        continue-on-error: true
        run: supabase db push --linked --dry-run --include-all

      - name: "Attempt: supabase db push (real, no password given)"
        id: db_push
        continue-on-error: true
        run: |
          set +e
          supabase db push --linked --include-all 2>&1 | tee /tmp/db_push.log
          exit "${PIPESTATUS[0]}"

      - name: Report db push outcome
        run: |
          {
            echo "### supabase db push --linked --include-all"
            echo "Outcome: **${{ steps.db_push.outcome }}**"
            echo '```'
            cat /tmp/db_push.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Fallback: apply every migration from 0011 onward via Management API"
        if: steps.db_push.outcome == 'failure'
        run: |
          echo "supabase db push failed without a DB password (see 'Report db push outcome' step for the exact error)." \
            "Applying every migration from 0011 onward directly instead, in order -" \
            "each one is written to be safe to re-run (see this workflow's header comment)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Migrations applied via Management API" >> "$GITHUB_STEP_SUMMARY"
          applied=0
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            version="${base%%_*}"
            # Zero-padded 4-digit numeric prefixes sort correctly as strings.
            if [[ "$version" > "0010" ]]; then
              echo "Applying $base ..."
              echo "- $base" >> "$GITHUB_STEP_SUMMARY"
              bash .github/workflows/scripts/mgmt_sql.sh "$(cat "$f")" > /dev/null
              applied=$((applied + 1))
            fi
          done
          echo "Applied $applied migration file(s) from 0011 onward."
          if [ "$applied" -eq 0 ]; then
            echo "::error::No migration files matched (version > 0010) - check the glob/versioning logic."
            exit 1
          fi

      - name: Verify Phase 1/2 schema exists in the live database
        run: |
          fn_result=$(bash .github/workflows/scripts/mgmt_sql.sh \
            "select proname from pg_proc where pronamespace = 'public'::regnamespace and proname in ('ninja_analytics_health', 'run_all_analytics_syncs') order by proname;")
          echo "$fn_result" | tee /tmp/functions_check.json

          table_result=$(bash .github/workflows/scripts/mgmt_sql.sh \
            "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('search_query_page_daily', 'rank_snapshots', 'competitor_domains', 'observed_serp_results') order by table_name;")
          echo "$table_result" | tee /tmp/tables_check.json

          {
            echo "### public functions present after migration"
            echo '```json'
            cat /tmp/functions_check.json
            echo '```'
            echo "### Phase 1/2 tables present after migration"
            echo '```json'
            cat /tmp/tables_check.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fn_count=$(echo "$fn_result" | jq 'length')
          table_count=$(echo "$table_result" | jq 'length')
          fail=0
          if [ "$fn_count" -ne 2 ]; then
            echo "::error::Expected both ninja_analytics_health and run_all_analytics_syncs in pg_proc, found $fn_count. Migration 0011 was not fully applied."
            fail=1
          fi
          if [ "$table_count" -ne 4 ]; then
            echo "::error::Expected search_query_page_daily, rank_snapshots, competitor_domains and observed_serp_results to all exist, found $table_count of 4. Migration 0014 was not fully applied."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy all Edge Functions
        # The full set the README documents under "Deploy the Edge Functions"
        # (step 5). Only manual-sync and scheduled-uptime were ever deployed
        # by this workflow - the rest turned out to have never been deployed
        # to this project at all, which is why manage-sites 404'd instead of
        # returning a JSON error the dashboard could show ("Could not save
        # the site."). Deploy the whole set every run, not just the two that
        # happened to have code changes in the PR that introduced this
        # workflow - a function with no local changes still needs deploying
        # if it was never live in the first place.
        run: |
          for fn in manage-sites manage-portfolio manual-sync \
                    scheduled-sync-gsc scheduled-sync-ga4 scheduled-sync-bing \
                    scheduled-uptime ai-briefing site-audit-crawl common-crawl-sync \
                    inspect-urls scheduled-inspect-urls execute-fix advance-fix-runs; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
            echo "::endgroup::"
          done

      - name: Verify all functions are listed as deployed
        run: |
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json \
            | tee /tmp/functions_list.json
          {
            echo "### supabase functions list"
            echo '```json'
            cat /tmp/functions_list.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for fn in manage-sites manage-portfolio manual-sync \
                    scheduled-sync-gsc scheduled-sync-ga4 scheduled-sync-bing \
                    scheduled-uptime ai-briefing site-audit-crawl common-crawl-sync \
                    inspect-urls scheduled-inspect-urls execute-fix advance-fix-runs; do
            # supabase functions list --output-format json has returned both a
            # bare array and {"functions": [...]} across CLI versions - accept
            # either shape rather than assuming the root itself is the array.
            # (.functions // .) alone would work for the wrapped shape but
            # throws "Cannot index array with string" on a bare array, since
            # jq's // only catches null/false, not a type error.
            if ! jq -e --arg fn "$fn" \
              '(if type == "array" then . else .functions end) | any(.[]; (.slug // .name // "") == $fn)' \
              /tmp/functions_list.json > /dev/null; then
              echo "::error::$fn not found in supabase functions list output"
              exit 1
            fi
          done

      - name: Baseline row counts (before live sync)
        run: |
          bash .github/workflows/scripts/mgmt_sql.sh \
            "select
               (select count(*) from public.sync_runs) as sync_runs,
               (select count(*) from public.uptime_checks) as uptime_checks;" \
            | tee /tmp/before_counts.json

      - name: Live health check (before)
        run: |
          bash .github/workflows/scripts/mgmt_sql.sh "select public.ninja_analytics_health();" \
            | tee /tmp/health_before.json
          {
            echo "### ninja_analytics_health() - before"
            echo '```json'
            cat /tmp/health_before.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the real GSC + GA4 + Bing + uptime sync
        run: |
          bash .github/workflows/scripts/mgmt_sql.sh "select public.run_all_analytics_syncs();" \
            | tee /tmp/run_all.json
          {
            echo "### run_all_analytics_syncs()"
            echo '```json'
            cat /tmp/run_all.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Poll until the dispatched syncs finish (up to 3 minutes)
        run: |
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 10
            running=$(bash .github/workflows/scripts/mgmt_sql.sh \
              "select count(*) as running from public.sync_runs where status = 'running' and started_at > now() - interval '10 minutes';" \
              | jq '.[0].running')
            echo "still running: $running"
            if [ "$running" = "0" ]; then
              echo "All dispatched sync_runs finished."
              break
            fi
          done

      - name: Live health check (after) + row-count proof
        run: |
          bash .github/workflows/scripts/mgmt_sql.sh "select public.ninja_analytics_health();" \
            | tee /tmp/health_after.json
          {
            echo "### ninja_analytics_health() - after"
            echo '```json'
            cat /tmp/health_after.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          bash .github/workflows/scripts/mgmt_sql.sh \
            "select
               (select count(*) from public.sync_runs) as sync_runs,
               (select count(*) from public.uptime_checks) as uptime_checks;" \
            | tee /tmp/after_counts.json
          {
            echo "### Row counts before vs after"
            echo "Before:"; echo '```json'; cat /tmp/before_counts.json; echo '```'
            echo "After:"; echo '```json'; cat /tmp/after_counts.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the live pipeline actually wrote rows and each source succeeded
        run: |
          before_sync_runs=$(jq '.[0].sync_runs' /tmp/before_counts.json)
          after_sync_runs=$(jq '.[0].sync_runs' /tmp/after_counts.json)
          before_uptime=$(jq '.[0].uptime_checks' /tmp/before_counts.json)
          after_uptime=$(jq '.[0].uptime_checks' /tmp/after_counts.json)

          fail=0

          if [ "$after_sync_runs" -le "$before_sync_runs" ]; then
            echo "::error::sync_runs row count did not increase ($before_sync_runs -> $after_sync_runs) - run_all_analytics_syncs did not actually dispatch/land any sync."
            fail=1
          fi
          if [ "$after_uptime" -le "$before_uptime" ]; then
            echo "::error::uptime_checks row count did not increase ($before_uptime -> $after_uptime) - the uptime probe did not run."
            fail=1
          fi

          echo "Per-integration status from the final health check:"
          bash .github/workflows/scripts/mgmt_sql.sh \
            "select s.name, i.source, i.last_status, i.last_error_code, i.last_error_message
             from public.integration_status i
             join public.sites s on s.id = i.site_id
             order by s.name, i.source;" | tee /tmp/final_status.json

          for source in gsc ga4 bing; do
            status=$(jq -r --arg s "$source" '[.[] | select(.source == $s)][0].last_status // "missing"' /tmp/final_status.json)
            echo "$source: $status"
            if [ "$status" != "success" ] && [ "$status" != "partial" ]; then
              msg=$(jq -r --arg s "$source" '[.[] | select(.source == $s)][0].last_error_message // "no error message"' /tmp/final_status.json)
              echo "::error::$source sync did not succeed (last_status=$status): $msg"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "One or more required live checks failed - see the ::error:: annotations above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All live checks passed: migration applied, all functions deployed, health check callable, GSC/GA4/Bing/uptime all wrote rows with a successful status." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the GSC query_page breakdown succeeded (search_query_page_daily)
        run: |
          # This is the specific breakdown Keyword Intelligence's ranking-URL
          # and cannibalisation detection depend on - a silent failure here
          # (e.g. search_query_page_daily missing) must fail the deploy, not
          # just show up as a quiet "partial" status later.
          result=$(bash .github/workflows/scripts/mgmt_sql.sh \
            "select s.name, sr.status, sr.metadata -> 'failedBreakdowns' as failed_breakdowns
             from public.sync_runs sr
             join public.sites s on s.id = sr.site_id
             where sr.source = 'gsc' and sr.started_at > now() - interval '10 minutes'
             order by sr.started_at desc;")
          echo "$result" | tee /tmp/gsc_query_page_check.json
          {
            echo "### GSC query_page breakdown status (this run's sync_runs rows)"
            echo '```json'
            cat /tmp/gsc_query_page_check.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$result" | jq -e 'any(.[]; (.failed_breakdowns // []) | index("query_page") != null)' > /dev/null; then
            echo "::error::At least one site's GSC sync reported query_page in failedBreakdowns - search_query_page_daily is still missing or broken."
            exit 1
          fi

      - name: Deep per-provider proof - real rows, not just a status flag
        run: |
          # A "success" status only proves the adapter ran without throwing.
          # This proves what it actually wrote: the exact sync_runs attempt
          # (rows_fetched/rows_written/range/error) and the current row count
          # in the actual metrics table each source writes to, per site. A
          # provider returning zero rows for the requested range is a
          # legitimate outcome (e.g. a brand-new property with no traffic
          # yet) - this reports rows_fetched/rows_written explicitly instead
          # of treating zero as pass/fail on its own, so a real zero-result
          # sync is never confused with a dispatch that never ran.
          bash .github/workflows/scripts/mgmt_sql.sh \
            "select s.name, sr.source, sr.status, sr.started_at, sr.finished_at,
                    sr.rows_fetched, sr.rows_written, sr.range_start, sr.range_end,
                    sr.error_code, sr.error_message
             from public.sync_runs sr
             join public.sites s on s.id = sr.site_id
             where sr.started_at > now() - interval '10 minutes'
             order by s.name, sr.source, sr.started_at desc;" | tee /tmp/recent_runs.json

          bash .github/workflows/scripts/mgmt_sql.sh \
            "select s.name,
                    (select count(*) from public.analytics_daily a where a.site_id = s.id) as ga4_rows,
                    (select count(*) from public.search_daily sd where sd.site_id = s.id and sd.engine = 'google') as gsc_search_daily_rows,
                    (select count(*) from public.search_daily sd where sd.site_id = s.id and sd.engine = 'bing') as bing_search_daily_rows,
                    (select count(*) from public.search_query_daily sq where sq.site_id = s.id and sq.engine = 'google') as gsc_query_rows,
                    (select count(*) from public.search_page_daily sp where sp.site_id = s.id and sp.engine = 'google') as gsc_page_rows,
                    (select count(*) from public.search_query_page_daily sqp where sqp.site_id = s.id and sqp.engine = 'google') as gsc_query_page_rows,
                    (select jsonb_build_object('ok', u.ok, 'status_code', u.status_code, 'checked_at', u.checked_at)
                     from public.uptime_checks u where u.site_id = s.id order by u.checked_at desc limit 1) as latest_uptime
             from public.sites s
             order by s.name;" | tee /tmp/table_row_proof.json

          {
            echo "### Deep per-provider proof"
            echo "**Recent sync_runs (last 10 minutes) - the actual attempt, not just current status:**"
            echo '```json'; cat /tmp/recent_runs.json; echo '```'
            echo "**Real row counts in each source's own table, per site:**"
            echo '```json'; cat /tmp/table_row_proof.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
