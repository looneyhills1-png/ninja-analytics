name: CI

# Main branch deploy workflows already perform build and live checks.
# Avoid a redundant paid hosted-runner CI job for every merge; validate PRs.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushing new commits doesn't
# waste minutes on stale checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Temporary one-shot formatter to recover exact Prettier output via CI logs.
      # This will be removed before merge.
      - name: Normalize OpenSEO integration and emit formatted source
        run: |
          FILES="scripts/open-seo-bridge.mjs scripts/open-seo-bridge.test.mjs scripts/serve-local.mjs src/features/open-seo/OpenSeoPage.tsx"
          ./node_modules/.bin/prettier --write $FILES
          for file in $FILES; do
            echo "FORMATTED_START:$file"
            base64 -w0 "$file"
            echo ""
            echo "FORMATTED_END:$file"
          done

      # Same checklist CONTRIBUTING.md asks contributors to run locally
      # before opening a PR - CI just makes it non-optional.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
